name: tests

on:
  push:
  pull_request:

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pytest==8.4.2
      # CUDA-only tests skip themselves on this runner.
      - name: Run pytest
        run: python -m pytest tests -q
      - name: Run SDPA equivalence check
        run: PYTHONPATH="$PWD" python scripts/diagnostics/test_sdpa.py --device cpu --output_dir results/sdpa
