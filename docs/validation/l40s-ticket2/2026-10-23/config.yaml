    partition: l40s
    account: l40s
    cpus: 1
    gpus: 1
    memory: 2G
    time: 00:05:00
  required_checks:
  - cuda-matmul
training:
  entrypoint: null
  resources:
    partition: null
    account: null
    cpus: null
    gpus: null
    memory: null
    time: null
checkpoint:
  enabled: true
  resume_entrypoint: null
  source: null
  cleanup_enabled: false
results:
  download_files:
  - results/preflight.json
  - results/exit-status
  - logs/slurm.log
  max_download_mib: 20
  log_tail_lines: 100
existing:
  references:
  - job/env.sh
  - job/README.md
  - job/submit_neighbor_tests.sh
  path_hints:
    neighbor_venv: /share/home/r15543056/.venvs/mdgen
