schema_version: 1
project: mdgen_neighbor
deployment_ready: false
ssh:
  target: r15543056@zinfandel.ncree.org
  options:
  - BatchMode=yes
  - ConnectTimeout=10
  - ConnectionAttempts=1
  - ServerAliveInterval=15
  - ServerAliveCountMax=2
  command_timeout_seconds: 60
remote:
  verified: false
  runs_root: /share/home/r15543056/MDgen/codex-runs
  datasets_root: null
  models_root: null
  checkpoints_root: null
runtime:
  setup_script: job/env.sh
  python: /share/home/r15543056/.venvs/mdgen2026/bin/python
  env:
    MDGEN_MODULES: python/3.11.12-gpu
    CUDA_HOME: /opt/cuda-12.8.0_570.86.10
sync:
  selection: git-tracked-code-plus-explicit-untracked
  extra_files: []
  max_file_mib: 10
  follow_symlinks: false
  delete: false
  exclude:
  - '**/.git/**'
  - '**/.venv*/**'
  - '**/.env*'
  - '**/__pycache__/**'
  - '**/.cache/**'
  - '**/data/**'
  - '**/splits/**'
  - '**/datasets/**'
  - '**/models/**'
  - '**/checkpoints/**'
  - '**/ckpt/**'
  - '**/logs/**'
  - '**/results/**'
  - '**/outputs/**'
  - '**/*.ckpt'
  - '**/*.pt'
  - '**/*.pth'
  - '**/*.safetensors'
  - '**/.aws/**'
  - '**/.ssh/**'
  - '**/*.pem'
  - '**/id_rsa*'
  - '**/id_ed25519*'
scheduler:
  type: slurm
  poll_interval_seconds: 30
smoke:
